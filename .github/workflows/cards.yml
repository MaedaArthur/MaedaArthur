name: Cards do README

on:
  schedule:
    # 06:17 UTC = 03:17 BRT, todo dia
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_cards.py
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera os SVGs
        env:
          # CARDS_PAT e opcional: so vale a pena se voce quiser contar
          # contribuicoes privadas. Sem ele, usa o token do proprio job.
          GITHUB_TOKEN: ${{ secrets.CARDS_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_cards.py ${{ github.repository_owner }}

      - name: Commita se algo mudou
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: atualiza os cards do README"
          git push
